apiVersion: apps/v1
kind: Deployment
metadata:
  name: bairro-seguro-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bairro-seguro-backend
  template:
    metadata:
      labels:
        app: bairro-seguro-backend
    spec:
      containers:
        - name: bairro-seguro-backend
          image: <IMAGEM_DOCKER>
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: bairro-seguro-secrets